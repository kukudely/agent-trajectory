<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trajectory Viewer</title>
<style>
:root { --bg:#f7f8fa; --panel:#fff; --border:#e3e6eb; --border-strong:#d6dae1; --text:#22262c; --muted:#7c8594;
  --blue:#377cf6; --user:#34a579; --assistant:#8a68b4; --tool:#e48724; --perm:#d45353; --sub:#238eaf; --end:#9aa3b2; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; overflow:hidden; font:14px/1.5 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
button, input { font:inherit; }
button { padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); cursor:pointer; }
button:hover { background:#f5f6f8; border-color:var(--border-strong); }
button:disabled { opacity:.55; cursor:default; }
code, .mono { font-family:ui-monospace, Consolas, "Cascadia Code", monospace; }
.app-header { height:48px; display:flex; align-items:center; gap:20px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--border); }
.brand { display:flex; align-items:center; gap:9px; min-width:245px; font-weight:650; font-size:16px; }
.brand-mark { width:22px; height:22px; display:grid; place-items:center; border-radius:6px; color:#fff; background:linear-gradient(145deg,#8b6ac2,#5f78dd); font-size:11px; }
.header-actions { margin-left:auto; display:flex; align-items:center; gap:12px; }
.header-actions label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; white-space:nowrap; }
#layout { display:grid; grid-template-columns:270px minmax(0,1fr); height:calc(100vh - 48px); min-height:0; overflow:hidden; }
.session-sidebar { min-width:0; overflow:auto; border-right:1px solid var(--border); background:var(--panel); padding:12px 10px; }
.session-sidebar h2 { margin:17px 6px 7px; font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.55px; color:var(--muted); }
.session-sidebar ul { list-style:none; margin:0; padding:0; }
.session-sidebar li { padding:8px 9px; border:1px solid transparent; border-radius:7px; cursor:pointer; overflow:hidden; }
.session-sidebar li:hover { background:#f5f6f8; }
.session-sidebar li.active { border-color:#bba8ed; background:#f5f1ff; box-shadow:inset 3px 0 #8061d2; }
.session-sidebar li > div:first-child { overflow:hidden; text-overflow:ellipsis; }
.session-sidebar li .t, .hint { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-toolbar { display:flex; gap:6px; }
.sidebar-toolbar input { min-width:0; flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:6px; }
#statsPanel { margin:7px 0; padding:6px 8px; border:1px solid var(--border); border-radius:6px; }
#statsPanel table { width:100%; border-collapse:collapse; font-size:10px; }
#statsPanel th, #statsPanel td { padding:3px; border-bottom:1px solid var(--border); text-align:left; }
#searchResults { max-height:220px; overflow:auto; }
.trajectory-shell { min-width:0; min-height:0; overflow:hidden; display:grid; grid-template-rows:42px 70px minmax(0,1fr); background:var(--panel); }
.trajectory-toolbar { display:flex; align-items:center; gap:17px; padding:0 12px; border-bottom:1px solid var(--border); color:var(--muted); font-size:12px; }
.metric { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.metric-icon { width:13px; height:13px; border:1px solid #9ca5b2; display:inline-grid; place-items:center; font-size:8px; }
.toolbar-spacer { flex:1; }
#search { width:min(260px,30vw); padding:6px 10px 6px 28px; border:1px solid var(--border); border-radius:6px; background:linear-gradient(90deg,transparent 0); }
.search-wrap { position:relative; }
.search-wrap::before { content:"⌕"; position:absolute; left:9px; top:4px; z-index:1; color:#9ba4b1; font-size:17px; }
.overview { display:grid; grid-template-columns:54px minmax(0,1fr); grid-template-rows:repeat(3,1fr); border-bottom:1px solid var(--border); background:#fbfbfc; overflow:hidden; }
.overview-label { padding:3px 8px; color:#98a1ae; font-size:11px; text-align:right; border-right:1px solid var(--border); }
.overview-track { position:relative; border-bottom:1px solid #edf0f3; overflow:hidden; }
.overview-track:last-child { border-bottom:0; }
.overview-bar { position:absolute; top:5px; bottom:5px; min-width:3px; border-radius:1px; opacity:.9; cursor:pointer; }
.overview-bar:hover { top:3px; bottom:3px; opacity:1; }
.overview-bar.input { background:var(--user); }
.overview-bar.model { background:var(--assistant); }
.overview-bar.tools { background:var(--tool); }
.trajectory-body { min-height:0; display:flex; }
#timeline { min-width:0; flex:1; overflow:auto; padding-bottom:12px; scrollbar-gutter:stable; overscroll-behavior:contain; background:#fff; }
.record-row { height:38px; display:grid; grid-template-columns:24px 90px minmax(160px,1fr) minmax(100px,.75fr) 72px; align-items:center; gap:7px; padding:0 10px 0 8px; border-bottom:1px solid #edf0f3; cursor:pointer; outline:none; font-size:12px; }
.record-row:hover { background:#faf9fd; }
.record-row.selected { background:#f5f1ff; box-shadow:inset 3px 0 #8061d2; }
.record-row:focus-visible { box-shadow:inset 0 0 0 2px #7ca6f8; }
.rail { position:relative; height:100%; }
.rail::before { content:""; position:absolute; left:10px; top:0; bottom:0; width:1px; background:#d8dde4; }
.rail::after { content:""; position:absolute; left:7px; top:16px; width:7px; height:7px; border-radius:50%; background:#a7afba; border:2px solid #fff; }
.record-tag { justify-self:start; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:650; letter-spacing:.15px; white-space:nowrap; }
.record-tag.user { color:#217c59; background:#e8f7f0; }
.record-tag.assistant { color:#7552a3; background:#f0eafb; }
.record-tag.tool { color:#b66a17; background:#fff1df; }
.record-tag.permission { color:#bd4545; background:#fdeaea; }
.record-tag.subagent { color:#1c7895; background:#e5f5fa; }
.record-tag.system, .record-tag.lifecycle { color:#6f7887; background:#eef0f3; }
.record-primary, .record-secondary { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.record-primary { color:#343a43; }
.record-primary strong { font-weight:650; }
.record-secondary { color:#78818f; font-family:ui-monospace, Consolas, "Cascadia Code", monospace; font-size:11px; }
.record-secondary::before { content:"→"; margin-right:8px; color:#a5adb8; }
.record-duration { text-align:right; color:#929aa6; font-size:11px; white-space:nowrap; }
.turn-row { height:30px; display:flex; align-items:center; justify-content:center; gap:10px; color:#9aa3b2; font-size:11px; letter-spacing:1px; border-bottom:1px solid #edf0f3; }
.turn-row::before, .turn-row::after { content:""; width:70px; border-top:1px dashed #dfe3e8; }
.empty { padding:70px 20px; text-align:center; color:var(--muted); }
.load-more { display:block; margin:10px auto; color:#7256b2; }
#inspector { width:420px; min-width:340px; overflow:auto; scrollbar-gutter:stable; overscroll-behavior:contain; border-left:1px solid var(--border); background:#fff; }
#inspector[hidden] { display:none; }
.inspector-head { height:52px; display:flex; align-items:center; gap:9px; padding:0 14px; border-bottom:1px solid var(--border); }
.inspector-title { min-width:0; flex:1; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.inspector-close { border:0; padding:4px 7px; font-size:20px; line-height:1; color:#5e6876; }
.inspector-tabs { height:43px; display:flex; align-items:end; gap:22px; padding:0 14px; border-bottom:1px solid var(--border); }
.inspector-tab { height:43px; padding:0 3px; border:0; border-radius:0; color:#748091; background:transparent; }
.inspector-tab.active { color:var(--blue); border-bottom:2px solid var(--blue); }
.inspector-body { padding:15px 14px 40px; }
.detail-grid { display:grid; grid-template-columns:105px minmax(0,1fr); gap:9px 12px; margin-bottom:20px; font-size:12px; }
.detail-label { color:#7f8896; }
.detail-value { min-width:0; word-break:break-word; }
.detail-section { margin:15px 0 7px; font-weight:650; font-size:12px; }
.detail-pre { margin:0; padding:10px; overflow:auto; max-height:420px; border:1px solid var(--border); border-radius:5px; background:#fafbfc; color:#333944; white-space:pre-wrap; word-break:break-word; font:11px/1.55 ui-monospace, Consolas, "Cascadia Code", monospace; }
.badge { display:inline-flex; padding:2px 7px; border-radius:4px; color:#fff; font-size:10px; white-space:nowrap; }
.badge.tool { background:var(--tool); } .badge.end { background:var(--end); }
.extra-title { margin-top:12px; color:var(--muted); font-weight:600; }
@media (max-width:1100px) {
  #layout { grid-template-columns:220px minmax(0,1fr); }
  #inspector { position:absolute; right:0; top:160px; bottom:0; width:min(430px,60vw); min-width:320px; z-index:4; box-shadow:-8px 0 24px #20242b18; }
  .trajectory-body { position:relative; }
  .record-row { grid-template-columns:20px 78px minmax(160px,1fr) 62px; }
  .record-secondary { display:none; }
}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><span class="brand-mark">T</span>Trajectory</div>
  <div class="header-actions">
    <label><input type="checkbox" id="merge" checked /> 合并 Claude transcript</label>
    <button id="refresh">刷新</button>
  </div>
</header>
<div id="layout">
  <aside class="session-sidebar">
    <div class="sidebar-toolbar">
      <input id="globalSearch" placeholder="全局检索（需 SQLite 投影）…" />
      <button id="statsBtn" title="基于 SQLite 投影的统计">统计</button>
    </div>
    <details id="statsPanel" hidden>
      <summary>会话统计</summary>
      <div id="statsBody"></div>
    </details>
    <ul id="searchResults" hidden></ul>
    <h2>Codex 会话（~/.codex/sessions）</h2>
    <ul id="codexSessionList"></ul>
    <h2>Claude 轨迹（hooks / stream-json）</h2>
    <ul id="sessionList"></ul>
    <h2>Claude transcript（~/.claude/projects）</h2>
    <ul id="transcriptList"></ul>
  </aside>
  <section class="trajectory-shell">
    <div class="trajectory-toolbar">
      <span class="metric"><span class="metric-icon">◷</span><span id="durationMetric">Duration —</span></span>
      <span class="metric"><span class="metric-icon"></span><span id="turnMetric">Turns —</span></span>
      <span class="metric"><span class="metric-icon"></span><span id="callMetric">Calls —</span></span>
      <span class="toolbar-spacer"></span>
      <span class="search-wrap"><input id="search" placeholder="搜索" /></span>
    </div>
    <section id="overview" class="overview" aria-label="轨迹概览"></section>
    <div class="trajectory-body">
      <main id="timeline"></main>
      <section id="inspector" aria-label="记录详情" hidden>
        <div class="inspector-head">
          <span id="inspectorBadge" class="record-tag system">RECORD</span>
          <div id="inspectorTitle" class="inspector-title"></div>
          <button id="inspectorClose" class="inspector-close" aria-label="关闭详情">×</button>
        </div>
        <nav id="inspectorTabs" class="inspector-tabs"></nav>
        <div id="inspectorBody" class="inspector-body"></div>
      </section>
    </div>
  </section>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
